<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Poin Gratis</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-950 text-white min-h-screen">
<header class="border-b border-slate-800 p-4"><div class="max-w-3xl mx-auto font-bold text-xl">GAME POIN GRATIS</div></header>
<main class="max-w-3xl mx-auto p-4 space-y-5">
<section id="authPanel" class="bg-slate-900 rounded-xl p-5 space-y-3">
<h1 class="text-xl font-bold">Masuk / Daftar</h1><input id="email" type="email" placeholder="Email" class="w-full p-3 rounded bg-slate-800">
<input id="password" type="password" placeholder="Password (min. 6 karakter)" class="w-full p-3 rounded bg-slate-800">
<div class="flex gap-2"><button id="loginBtn" class="bg-blue-600 px-4 py-2 rounded">Masuk</button><button id="registerBtn" class="bg-emerald-600 px-4 py-2 rounded">Daftar</button></div><p id="authMsg" class="text-sm text-amber-300"></p>
</section>
<section id="userPanel" class="hidden space-y-4">
<div class="bg-slate-900 rounded-xl p-5 flex justify-between items-center"><div><p class="text-slate-400 text-sm">Poin virtual gratis</p><p id="points" class="text-3xl font-bold">0</p></div><button id="logoutBtn" class="bg-slate-700 px-3 py-2 rounded">Keluar</button></div>
<div class="bg-slate-900 rounded-xl p-5 space-y-3"><h2 class="font-bold text-lg">Minta poin gratis</h2><p class="text-slate-400 text-sm">Permintaan akan diperiksa admin. Poin tidak dapat dibeli, diuangkan, dipindahtangankan, atau ditarik.</p>
<label class="block text-sm">Jumlah poin (maksimal 100 per permintaan)</label><input id="amount" type="number" min="1" max="100" value="25" class="w-full p-3 rounded bg-slate-800">
<button id="requestBtn" class="bg-emerald-600 px-4 py-2 rounded">Kirim permintaan</button><p id="requestMsg" class="text-sm text-amber-300"></p></div>
<div class="bg-slate-900 rounded-xl p-5"><h2 class="font-bold mb-3">Riwayat permintaan</h2><div id="history" class="space-y-2 text-sm text-slate-300">Belum ada permintaan.</div></div>
</section></main><script type="module" src="./js/app.js"></script></body></html>
