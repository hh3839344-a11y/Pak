<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Poin Gratis</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-950 text-white min-h-screen"><header class="p-4 border-b border-slate-800"><div class="max-w-4xl mx-auto font-bold text-xl">ADMIN · POIN GRATIS</div></header>
<main class="max-w-4xl mx-auto p-4 space-y-4"><section class="bg-slate-900 p-5 rounded-xl space-y-3"><h1 class="font-bold text-lg">Login admin</h1><input id="email" type="email" placeholder="Email admin" class="w-full p-3 rounded bg-slate-800"><input id="password" type="password" placeholder="Password" class="w-full p-3 rounded bg-slate-800"><button id="loginBtn" class="bg-blue-600 px-4 py-2 rounded">Masuk</button><button id="logoutBtn" class="hidden bg-slate-700 px-4 py-2 rounded">Keluar</button><p id="msg" class="text-sm text-amber-300"></p></section>
<section id="adminPanel" class="hidden bg-slate-900 p-5 rounded-xl"><h2 class="font-bold text-lg mb-3">Permintaan poin</h2><div id="requests" class="space-y-3">Memuat…</div></section></main><script type="module" src="../js/admin.js"></script></body></html>
